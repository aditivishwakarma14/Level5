name : deploy to ec2
on: 
   push:
     branches:
       - main 
#matlab deploy tb hi karna jb hamar  code main bracnch m push ho rha ho 

# refer this https://github.com/actions/checkout/blob/main/.github/workflows/test.yml

jobs: 
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: deploy via ssh
        uses: appleboy/ssh-action@v1
        with: 
          host: ${{secrets.SSH_HOST}}
          username: ubuntu
          key: ${{secrets.SSH_KEY}}
          script: |
            cd ~/level5
            git pull
            sudo docker compose down
            sudo docker compose up -d --build







